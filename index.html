<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icona-192.png">
  <meta name="theme-color" content="#fff8ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#230505" media="(prefers-color-scheme: dark)">
  <!-- viewport-fit=cover: il foglio arriva fino ai bordi anche sui telefoni col notch (le icone usano env(safe-area-inset-*)) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Calendario</title>
  <script>
    // Tema prima del primo disegno: la scelta salvata, altrimenti quella del sistema (vedi src/tema.js)
    (function () {
      var salvato = null;
      try { salvato = localStorage.getItem('color-theme'); } catch (e) { }
      var scuro = salvato ? salvato === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (scuro) document.documentElement.setAttribute('color-theme', 'dark');
      // Con una scelta salvata, anche le barre del telefono seguono quella e non il sistema
      if (salvato) document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = scuro ? '#230505' : '#fff8ec'; });
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
