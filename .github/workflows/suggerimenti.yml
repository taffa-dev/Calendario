# Server delle proposte: test, poi immagine linux/arm64 per il Raspberry Pi su GHCR.
# Il Pi la scarica solo quando glielo si dice (docker compose pull, vedi suggerimenti/LEGGIMI.md).
name: Suggerimenti

on:
  push:
    branches: [master]
    paths: ['suggerimenti/**', '.github/workflows/suggerimenti.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  immagine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: suggerimenti
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: suggerimenti/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: suggerimenti
          platforms: linux/arm64
          push: true
          tags: ghcr.io/taffa-dev/calendario-suggerimenti:latest
